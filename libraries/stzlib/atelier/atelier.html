<style>
/* The Softanza Atelier, written to the Zui constitution (v3.13) and to stzsite's reading
   of it (assets/css/site.css): the same paper, ink, teal accent, resting shadow, serif titles.
   The rules it answers are named where they bind.

   Rule 107, 105    ONE reading size (1.3125rem); the hero and the titles are the only others;
                    mono labels and code at optical parity; nothing under 1rem; every pair below 4.5:1 or better
   Rule 3, 5, 10    paper tones, one accent (action and selection), one resting shadow, no gradient
   Rule 112, 17, 1  nothing moves: no transition, no animation, no smooth scroll
   Rule 13, 110     the top bar sticks and holds its own space; nothing floats over the reading
   B4               the edition of a notebook: the page, the recording and the dictionary in ONE static file;
                    nothing runs and nothing is fetched; every cell carries its citation <commit>:<id>
   B3               the lessons: the Learning System's chapters opened as notebooks, each cell judged by
                    the course's own court, each exercise checked and recorded by the learner's own Submit;
                    a draft translation says so first; Arabic reads right to left, its code left to right
   B2               a notebook of cells: running cell k runs cells 1 to k as one program, so a name a
                    cell makes is the one the cells below read; saved as a narrated test file, opened back;
                    a library check forked into a cell as its Then line
   B1               the process: a chain on a ? line unfolded step by step with each value and its time,
                    the same move in its other forms (offered, put in the cell by the reader, never run
                    behind their back), and a scene's object after every line, changed or not
   B0               the notebook is home: a cell, every ? line seen in its value's own face, every
                    #--> promise judged by testoor's matcher; the playground it replaces is gone
   Rule 27          a horizontal main menu of three short labels and NO second level: the domains filter one
                    page, they are not pages, so they are a selector beside the search, never a menu
   Rule 108, 25     the trail from the root, every ancestor a link, the current step marked
   Rule 11, 47, 127 tables declare their columns, numbers right-aligned and tabular, text left
   Rule 14, 129     no container scrolls sideways: a narrow screen sheds the context columns, never the state
   Rule 117, 3      colour is spent once per table, on the state column, and always beside its word
   Rule 113         a state label sits beneath what it classifies, and after it in the document
   Rule 122         every string comes from i18n.json, one dictionary per language
   Rule 19, 69      every control at least 44px tall
   Rule 15, 38      space reserved before results arrive, so nothing shoves the reading */

/* contrast: #1B211F | #F1F3F1 | 7 | reading ink on paper, light */
/* contrast: #3E4744 | #F1F3F1 | 7 | secondary ink on paper, light */
/* contrast: #1B6B72 | #F1F3F1 | 4.5 | link and selection on paper, light */
/* contrast: #1B6B72 | #FBFCFB | 4.5 | link on panel, light */
/* contrast: #0E4E54 | #DEE7E6 | 4.5 | eyebrow on the tinted head, light */
/* contrast: #F1F3F1 | #1B6B72 | 4.5 | the primary button, light */
/* contrast: #23664A | #E4F1EA | 4.5 | pass and kept, light */
/* contrast: #993A25 | #F6E3DD | 4.5 | fail and diverged, light */
/* contrast: #7A4F0E | #F6ECD9 | 4.5 | error and unreached, light */
/* contrast: #2F5A86 | #E4ECF4 | 4.5 | unjudged, light */
/* contrast: #5C3F7A | #EEE7F4 | 4.5 | unperceived, light */
/* contrast: #EAEEEB | #121614 | 7 | reading ink on paper, dark */
/* contrast: #B7C1BC | #121614 | 7 | secondary ink on paper, dark */
/* contrast: #5FB6BC | #121614 | 4.5 | link and selection on paper, dark */
/* contrast: #121614 | #5FB6BC | 4.5 | the primary button, dark */
/* contrast: #63B98C | #1B2F26 | 4.5 | pass and kept, dark */
/* contrast: #DB8069 | #31201B | 4.5 | fail and diverged, dark */
/* contrast: #D6A559 | #302811 | 4.5 | error and unreached, dark */
/* contrast: #7BA8D4 | #1B2733 | 4.5 | unjudged, dark */
/* contrast: #B99AD8 | #27203A | 4.5 | unperceived, dark */

:root{
  --paper:#F1F3F1; --panel:#FBFCFB; --panel-2:#EAEEEB;
  --ink:#1B211F; --ink-2:#3E4744;
  --line:#D5DBD7; --line-2:#C3CAC6;
  --accent:#1B6B72; --accent-ink:#0E4E54; --on-accent:#F1F3F1;
  --head-tint:#DEE7E6;
  --shadow:0 1px 2px rgba(27,33,31,.04),0 6px 18px rgba(27,33,31,.05);
  --pass:#23664A; --pass-bg:#E4F1EA;
  --fail:#993A25; --fail-bg:#F6E3DD;
  --err:#7A4F0E; --err-bg:#F6ECD9;
  --unj:#2F5A86; --unj-bg:#E4ECF4;
  --unp:#5C3F7A; --unp-bg:#EEE7F4;
  --read:1.3125rem; --lh:1.7; --label:1.0625rem; --code:1.125rem;
  --title:clamp(1.875rem,3.4vw,2.5rem); --hero:clamp(2.5rem,5.2vw,3.75rem);
  --maxw:1180px; --gutter:24px; --bar:18%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --panel:#1A201E; --panel-2:#232B28; --ink:#EAEEEB; --ink-2:#B7C1BC;
    --line:#2C3532; --line-2:#3A443F; --accent:#5FB6BC; --accent-ink:#8FD3D8; --on-accent:#121614; --head-tint:#192423;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
    --pass:#63B98C; --pass-bg:#1B2F26; --fail:#DB8069; --fail-bg:#31201B; --err:#D6A559; --err-bg:#302811;
    --unj:#7BA8D4; --unj-bg:#1B2733; --unp:#B99AD8; --unp-bg:#27203A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --panel:#1A201E; --panel-2:#232B28; --ink:#EAEEEB; --ink-2:#B7C1BC;
  --line:#2C3532; --line-2:#3A443F; --accent:#5FB6BC; --accent-ink:#8FD3D8; --on-accent:#121614; --head-tint:#192423;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  --pass:#63B98C; --pass-bg:#1B2F26; --fail:#DB8069; --fail-bg:#31201B; --err:#D6A559; --err-bg:#302811;
  --unj:#7BA8D4; --unj-bg:#1B2733; --unp:#B99AD8; --unp-bg:#27203A; color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box;transition:none!important;animation:none!important;scroll-behavior:auto!important}
html{font-size:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--read);line-height:var(--lh)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
a{color:var(--accent)}
code,pre,kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
code{font-size:var(--code);background:var(--panel-2);padding:1px 6px;border-radius:5px}
pre{margin:0;font-size:var(--code);line-height:1.6;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 18px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible}
.skip{position:absolute;left:-999px;top:0;background:var(--panel);padding:12px 16px}
.skip:focus{left:16px;top:8px;z-index:60}

/* the bars: they stick and hold their own space */
.top{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);min-height:64px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:1.5rem;font-weight:600;color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.menu{display:flex;gap:0 24px;flex-wrap:wrap}
.menu a{font-size:var(--read);font-weight:500;color:var(--ink-2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;border-bottom:3px solid transparent}
.menu a[aria-current="page"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.tools{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.tools a,.tools button{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);color:var(--accent-ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.trail{background:var(--paper)}
.trail ol{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);list-style:none;display:flex;flex-wrap:wrap;gap:0 12px}
.trail li{min-height:44px;display:inline-flex;align-items:center;font-size:var(--read)}
.trail li+li::before{content:"\203A";color:var(--ink-2);margin-right:12px}
.trail a{color:var(--accent);font-weight:500}
.trail [aria-current="page"]{font-weight:700;color:var(--ink)}

/* the head of the page: a resting tint, never emphasis */
.page-head{background:var(--head-tint);padding:32px 0 32px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:var(--hero);font-weight:600;line-height:1.06;letter-spacing:-.015em;margin:12px 0 0;max-width:24ch}
h2{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:var(--title);font-weight:600;line-height:1.15;margin:0 0 16px}
h3{font-size:var(--read);font-weight:700;margin:0 0 8px}
.lead{max-width:72ch;margin:16px 0 0;color:var(--ink-2)}
.status{margin:24px 0 0;max-width:96ch}
.status p{margin:4px 0}
.status b{font-weight:700}

/* the body: one column, the reading */
.body{padding:32px 0 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);margin:0 0 24px}
.card p:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label{font-weight:600}
input[type=search],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;min-height:44px;padding:6px 12px}
input[type=search]{width:100%}
select{padding-right:32px}
textarea{width:100%;min-height:10rem;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--code);line-height:1.6;resize:vertical;padding:12px 14px}
.hint{color:var(--ink-2);margin:8px 0 0}
button.act{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer}
button.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.act:disabled{color:var(--ink-2);border-style:dashed;cursor:default}
.progress{height:8px;background:var(--line);border-radius:4px;margin:16px 0 0;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0}
.summary{display:flex;flex-wrap:wrap;gap:16px 32px;min-height:5.5rem;margin:16px 0 0}
.summary .k{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);color:var(--ink-2)}
.summary .v{font-size:var(--title);font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.runinfo{min-height:1.7em;margin:12px 0 0;color:var(--ink-2)}

/* a state word: the one coloured encoding of a fact, always with its text */
.st{display:inline-block;font-weight:700;padding:2px 12px;border-radius:8px;border:1px solid transparent}
.st-pass,.st-kept{color:var(--pass);background:var(--pass-bg)}
.st-fail,.st-diverged{color:var(--fail);background:var(--fail-bg)}
.st-err,.st-unreached{color:var(--err);background:var(--err-bg)}
.st-unjudged{color:var(--unj);background:var(--unj-bg)}
.st-unperceived{color:var(--unp);background:var(--unp-bg)}

/* the domain groups and the checks */
details.dom{border-top:1px solid var(--line);padding:8px 0}
details.dom>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:600}
details.dom>summary .n{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);font-weight:600;color:var(--ink-2)}
.chk{padding:16px 0;border-top:1px dashed var(--line)}
.chk .desc{font-weight:600;margin:0}
.chk .meta{color:var(--ink-2);margin:4px 0 0;overflow-wrap:anywhere}
.chk .meta span+span::before{content:" \00B7 ";color:var(--ink-2)}
.chk .verdict{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.chk .changed{font-weight:600}
.chk pre{margin:8px 0 0}
.chk details{margin:8px 0 0}
.chk details>summary{cursor:pointer;color:var(--accent);min-height:44px;display:inline-flex;align-items:center;font-weight:500}
.chk .ring{margin:4px 0 0;color:var(--ink-2)}

/* tables: a ledger */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin:16px 0 0}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);font-weight:600;color:var(--ink-2);background:var(--panel-2)}
tr.total td{font-weight:700;border-top:2px solid var(--line-2)}
td.name{overflow-wrap:anywhere;text-align:left}
.see{margin:0 0 24px}
.see .seeline{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.see .face{margin:12px 0 0}
.see .facelabel{color:var(--ink-2);margin:0 0 4px}
.see .promise{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.drawing{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.cellsum{margin:0 0 24px}
.process{margin:16px 0 0;border-top:1px dashed var(--line);padding:12px 0 0}
.process table td.code,.process table td.val{text-align:left;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--code);overflow-wrap:anywhere}
.process tr.changed td{font-weight:700}
.process th.l{text-align:left}
.process td.nw{white-space:nowrap;text-align:left}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:8px 0 0}
.forms h4{margin:0 0 6px;font-size:var(--read);font-weight:700}
.forms .act{margin-top:8px}
.files{margin:8px 0 16px}
.files summary{cursor:pointer;color:var(--accent);min-height:44px;display:inline-flex;align-items:center;font-weight:500}
.files table th:nth-child(2),.files table td:nth-child(2){text-align:left}
.files table th:nth-child(3),.files table td:nth-child(3){text-align:left}

.chk .cite{margin:4px 0 0}
body.embed .top,body.embed .trail,body.embed .page-head{display:none}
body.embed .body{padding:16px 0}
body.embed .card{box-shadow:none}
body.embed #view-edition > h2,body.embed #view-edition > .card{display:none}
#playout{min-height:4rem;margin:16px 0 0}
.playtime{margin:8px 0 0;color:var(--ink-2);min-height:1.7em}
.nbcell .cellhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 12px}
.nbcell .cellno{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--label);font-weight:600;color:var(--ink-2)}
.nbcell input.celltitle{flex:1 1 16rem;font-weight:600}
.nbcell .cellsum{margin:16px 0 0}
.cellout .see{border-top:1px dashed var(--line);padding:16px 0 0;margin:16px 0 0}
.cellout .scene{border-top:1px dashed var(--line);padding:16px 0 0;margin:16px 0 0}
.nbtools{margin:16px 0 0}
.undo{margin-left:12px}
.lsform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:16px 0 0}
.lsform label{display:block;margin:0 0 4px}
.lsform select,.lsform input{width:100%}
.lesson .prose{max-width:72ch;margin:0 0 24px}
.lesson .prose h3{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:var(--title);font-weight:600;line-height:1.15;margin:32px 0 12px}
.lesson .prose h4{font-size:var(--read);font-weight:700;margin:24px 0 8px}
.lesson .prose pre,.lesson .exercise pre{margin:12px 0}
.lesson blockquote{margin:12px 0;padding:4px 16px;border-inline-start:4px solid var(--line-2);color:var(--ink-2)}
.notice{border-left:6px solid var(--err);background:var(--err-bg);color:var(--ink);border-radius:10px;padding:16px 20px;margin:0 0 24px}
.court{margin:16px 0 0;border-top:1px dashed var(--line);padding:16px 0 0}
.court ul{list-style:none;margin:8px 0 0;padding:0}
.court li{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 8px}
.exercise .task{max-width:72ch}
.exercise .verdictrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:12px 0 0}
.lsprogress{margin:12px 0 0}
[dir="rtl"] textarea,[dir="rtl"] pre,[dir="rtl"] code{direction:ltr;text-align:left}
kbd{font-size:var(--label);border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:var(--panel-2)}

/* a narrow screen: context columns leave, the state stays */
@media (max-width:900px){
  table .ctx{display:none}
}
</style>
</head>

</header>

<main id="main">
<div class="page-head"><div class="wrap">
  <p class="eyebrow" data-t="eyebrow">The library's own assertions, run live</p>
  <h1 data-t="title">Softanza Atelier</h1>
  <p class="lead" data-t="lead"></p>
  <div class="status" aria-live="polite">
    <p><b id="statuslabel" data-t="status_label">The program</b>: <span id="libstate" data-t="lib_asking">asking the server</span></p>
    <p id="judged"></p>
    <p id="served"></p>
  </div>
</div></div>

<div class="body"><div class="wrap">

<section id="view-checks" hidden aria-labelledby="h-checks">
  <h2 id="h-checks" data-t="menu_checks">Checks</h2>
  <div>
      <div class="card">
        <p id="chkinfo"></p>
        <label for="search" data-t="search_label">Find a check</label>
        <input type="search" id="search" autocomplete="off">
        <p class="hint" data-t="search_hint"></p>
        <div class="row" style="margin-top:16px">
          <label for="domain" data-t="domains_label">Domains</label>
          <select id="domain"></select>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="act primary" id="rundomain" data-t="run_domain">Run this domain</button>
          <button class="act" id="runall" data-t="run_all">Run every check</button>
          <button class="act" id="runfailed" disabled data-t="run_failed">Run the failures again</button>
          <label for="show" data-t="show_label">Show</label>
          <select id="show">
            <option value="all" data-t="show_all">every check</option>
            <option value="bad" data-t="show_bad">failures and errors</option>
            <option value="differs" data-t="show_differs">those that differ from Ring</option>
            <option value="changed" data-t="show_changed">those that changed since the last run</option>
          </select>
        </div>
        <div class="progress" aria-hidden="true"><div id="prog"></div></div>
        <p class="runinfo" id="runinfo" aria-live="polite"></p>
        <div class="summary" id="totals"></div>
      </div>
      <div class="card" id="chklist"><p data-t="nothing_run"></p></div>
  </div>
</section>

<section id="view-coverage" hidden aria-labelledby="h-coverage">
  <h2 id="h-coverage" data-t="menu_coverage">Coverage</h2>
  <div class="card">
    <p data-t="coverage_intro"></p>
    <p id="coverhead" data-t="coverage_none"></p>
    <p id="coverfiles"></p>
  </div>
  <div class="card" id="covertable" hidden></div>
</section>

<section id="view-check" hidden aria-labelledby="h-check">
  <h2 id="h-check" data-t="menu_check">Check</h2>
  <div class="card" id="onecheck"></div>

<script>
const EDITION = null; /*EDITION*/
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- language: every string is a key of i18n.json (Rule 122) ----
let I18N = {}, LANG = 'en';
function t(key, vars) {

}
function applyLang() {

    const k = el.dataset.t;

  ll.href = location.pathname + '?' + qs.toString(); ll.lang = other; ll.hreflang = other;
  $('#themebtn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? t('theme_light') : t('theme_dark');
  renderStatus(); renderDomains(); renderChecks(shown); renderTotals(); renderCoverage(); renderOne(); renderCell();
}
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  let l = q;
  try { if (!l) l = localStorage.getItem('atelier.lang'); } catch (e) {}
  if (!l) l = (navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en';
  LANG = l === 'fr' ? 'fr' : 'en';
  try { localStorage.setItem('atelier.lang', LANG); } catch (e) {}
}

// ---- the view: one page, three addresses, the menu tells the truth (Rules 26, 116) ----
const P = location.pathname;
// a menu link keeps the page's language, and a lesson's address carries its own choices
const LANGQ = () => { const l = new URLSearchParams(location.search).get('lang'); return l ? '?lang=' + l : ''; };
const NBED = !!(EDITION && EDITION.kind === 'notebook');
const VIEW = NBED ? 'edition' : /\/check(\.html)?$/.test(P) ? 'check' : /coverage(\.html)?$/.test(P) ? 'coverage' : (EDITION || /\/library$/.test(P)) ? 'checks' : (!EDITION && /\/lessons$/.test(P)) ? 'lessons' : 'notebook';
const URLS = NBED
  ? { checks: null, results: null, tours: null, i18n: null, verdicts: null, home: 'index.html', library: 'index.html', coverage: 'index.html', one: 'index.html', lessons: 'index.html' }
  : EDITION
  ? { checks: 'data/checks.json', results: 'data/results.json', tours: 'data/tours.json', i18n: 'data/i18n.json', verdicts: null, home: 'index.html', library: 'index.html', coverage: 'coverage.html', one: 'check.html' }
  : { checks: '/atelier/checks', results: '/atelier/results', tours: '/atelier/tours', i18n: '/atelier/i18n', verdicts: '/atelier/verdicts', home: '/', lessons: '/atelier/lessons', library: '/atelier/library', coverage: '/atelier/coverage', one: '/atelier/check' };
if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
document.querySelectorAll('#menu a').forEach(a => {
  const v = a.dataset.view;
  a.href = (v === 'notebook' ? URLS.home : v === 'lessons' ? URLS.lessons : v === 'checks' ? URLS.library : URLS.coverage) + (VIEW === 'lessons' || v === 'lessons' ? (LANGQ()) : (location.search || ''));
  if (v === VIEW) a.setAttribute('aria-current', 'page');
  if (EDITION && (v === 'notebook' || v === 'lessons')) a.hidden = true;
});
$('.brand').href = URLS.home + (location.search || '');
$('#trailroot').href = URLS.home;
$('#trailmida').href = URLS.library;
if (VIEW === 'check') $('#trailmid').hidden = false;
if (NBED) { $('.page-head .eyebrow').dataset.t = 'nbed_eyebrow'; $('.page-head .lead').dataset.t = 'nbed_lead'; $('#menu').hidden = true; delete $('#trailhere').dataset.t; $('#trailhere').textContent = EDITION.name; }
else $('#trailhere').dataset.t = 'menu_' + VIEW;
$('#view-' + VIEW).hidden = false;
if (EDITION) {
  // read-only: nothing here runs, and the Ring comparison is not part of an edition
  ['#rundomain', '#runall', '#runfailed', '.progress', '#runinfo'].forEach(q => $(q).hidden = true);
  document.querySelectorAll('#show option[value="differs"], #show option[value="changed"]').forEach(o => o.remove());
  $('#statuslabel').dataset.t = 'status_label_edition';
}

// ---- theme: a verb on the button (Rule 106) ----
$('#themebtn').onclick = () => {
  const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', now);
  try { localStorage.setItem('atelier.theme', now); } catch (e) {}
  $('#themebtn').textContent = now === 'dark' ? t('theme_light') : t('theme_dark');
};

// ---- the server's state: what judges a check is named (Rule 99) ----
let STATE = null, stzReady = false;
function renderStatus() {
  if (NBED) {
    const R = EDITION.recording;
    $('#libstate').textContent = t('nbed_note');
    $('#judged').textContent = t('nbed_judged', { taken: EDITION.taken, library: EDITION.library, rnxc: EDITION.rnxc, engine: EDITION.engine });
    $('#served').textContent = t('nbed_counts', { n: fmtN(R.cells.length), kept: fmtN(R.kept), diverged: fmtN(R.diverged) });
    return;
  }
  if (EDITION) {
    $('#libstate').textContent = t('edition_note');
    $('#judged').textContent = t('edition_judged', { taken: EDITION.taken, library: EDITION.library, rnxc: EDITION.rnxc, engine: EDITION.engine, n: fmtN(CHECKS.length || EDITION.checks), source: EDITION.source, commit: EDITION.checks_from });
    $('#served').textContent = '';
    return;
  }
  if (!STATE) return;
  const L = STATE.library, st = L.state;
  $('#libstate').textContent = st === 'admitted' ? t('lib_admitted', { s: L.seconds }) : st === 'compiling' ? t('lib_compiling', { s: Math.max(0, Math.round((Date.now() - T0) / 1000)) }) : t('lib_refused', { why: L.why });
  $('#judged').textContent = t('judged_by', { commit: L.commit, rnxc: STATE.rnxc.build, engine: STATE.engine });
  $('#served').textContent = t('served', { n: fmtN(STATE.served), f: fmtN(STATE.functions), r: fmtN(STATE.runs) });
}
const T0 = Date.now();
async function status() {
  try {
    STATE = await (await fetch('/atelier/state')).json();
    stzReady = STATE.library.state === 'admitted';
  } catch (e) { STATE = null; $('#libstate').textContent = t('lib_gone'); }
  renderStatus();
}
if (!EDITION) (async function poll() { await status(); setTimeout(poll, stzReady ? 5000 : 1000); })();

async function run(code) {
  const t0 = performance.now();
  const r = await fetch('/atelier/run', { method: 'POST', body: code });
  const text = await r.text();
  return { status: r.status, text, ms: performance.now() - t0 };
}

// ---- the checks ----
let META = null, CHECKS = [], LAST = {}, VERD = null, results = {}, shown = [], DOMAIN = '*', QUERY = '';
try { LAST = JSON.parse(localStorage.getItem('atelier.last') || '{}'); } catch (e) {}
function kindOf(r) { return r.status !== 200 ? 'err' : r.text.startsWith('PASS') ? 'pass' : 'fail'; }
function ringOf(c) {
  const v = VERD && VERD.verdicts && VERD.verdicts[c.id];
  if (!v) return null;
  const m = v.ring === 'err' && /without definition: (stzengine\w+)/i.exec(v.ring_said);
  return { kind: m ? 'none' : v.ring, said: v.ring_said, lacks: m ? m[1] : '' };
}
function differs(c, r) {
  const g = ringOf(c);
  if (!g || g.kind === 'none') return false;
  if (g.kind !== r.kind) return true;
  if (r.kind === 'fail') return r.text.split('\n').slice(1).join('\n').trim() !== g.said.trim();
  if (r.kind === 'err') return r.text.trim().split('\n')[0] !== g.said.trim().split('\n')[0];
  return false;
}
function ringNote(c, r) {
  const g = ringOf(c);
  if (!g) return '';
  if (g.kind === 'none') return t('ring_none', { what: esc(g.lacks) });
  const d = differs(c, r);
  const what = g.kind === 'pass' ? t('ring_pass') : g.kind === 'fail' ? (d ? t('ring_other_fail') : t('ring_same_fail')) : (d ? t('ring_other_err', { what: esc(g.said.split('\n')[0]) }) : t('ring_same_err'));
  return (d ? '<b>' + t('ring_differs') + '</b>, ' : '') + what;
}
function selection() {
  const q = QUERY.trim().toLowerCase();
  return CHECKS.filter(c => (DOMAIN === '*' || c.domain === DOMAIN) &&
    (!q || (c.desc + ' ' + c.file + ' ' + c.scenario + ' ' + c.id).toLowerCase().includes(q)));
}
function renderDomains() {
  if (!CHECKS.length) return;
  const doms = {};
  CHECKS.forEach(c => doms[c.domain] = (doms[c.domain] || 0) + 1);
  const opt = (key, label, n) => `<option value="${esc(key)}" ${DOMAIN === key ? 'selected' : ''}>${esc(label)} (${fmtN(n)})</option>`;
  $('#domain').innerHTML = opt('*', t('all_domains'), CHECKS.length) + Object.keys(doms).sort().map(k => opt(k, k, doms[k])).join('');
  $('#domain').onchange = () => { DOMAIN = $('#domain').value; shown = selection(); renderChecks(shown); renderTotals(); };
  $('#chkinfo').textContent = META ? t('checks_intro', { n: fmtN(CHECKS.length), files: fmtN(META.files), source: META.source, commit: META.commit }) : '';
}
const st = k => `<span class="st st-${k}">${t('state_' + k)}</span>`;
// one check as a card: what it says, where it comes from, how to cite it, what is known of it
let RECORDED = {}, RECINFO = null, RECCOMMIT = '';
const oneHref = c => URLS.one + '?id=' + encodeURIComponent(c.id) + '&lang=' + LANG;
function cardHtml(c, r) {
  let verdict = '', more = '', ring = '';
  if (r) {
    const changed = r.ms != null && LAST[c.id] && LAST[c.id] !== r.kind;
    const how = r.ms != null ? t('ms', { ms: fmt1(r.ms) }) : t('recorded_at', { commit: esc(RECCOMMIT) });
    verdict = `<div class="verdict">${st(r.kind)}<span>${how}</span>${changed ? `<span class="changed">${t('was', { state: t('state_' + LAST[c.id]) })}</span>` : ''}</div>`;
    if (r.kind === 'fail') { const [, exp, got] = r.text.split('\n'); more = `<pre>${t('expected')}: ${esc(exp ?? '')}\n${t('got')}: ${esc(got ?? '')}</pre>`; }
    else if (r.kind === 'err') more = `<pre>${esc(r.text)}</pre>`;
    const note = (r.kind !== 'pass' || differs(c, r)) ? ringNote(c, r) : '';
    if (note) ring = `<p class="ring">${note}</p>`;
  }
  const cite = (RECCOMMIT || META.commit) + ':' + c.id;
  return `<article class="chk" id="c-${esc(c.id).replace(/[^A-Za-z0-9_-]/g, '_')}">
    <p class="desc">${esc(c.desc)}</p>
    <p class="meta"><span>${t('provenance', { file: esc(c.file), line: c.line })}</span>${c.scenario ? `<span>${t('scenario', { s: esc(c.scenario) })}</span>` : ''}<span>${t('at_commit', { commit: esc(META.commit) })}</span><span class="mono">${t('id_label', { id: esc(c.id) })}</span></p>
    ${verdict}${more}${ring}
    <p class="meta cite"><span>${t('cite_label')}</span><span class="mono">${esc(cite)}</span><span><a href="${esc(oneHref(c))}">${t('open_check')}</a></span>${EDITION ? '' : `<span><a href="${esc(URLS.home + '?fork=' + encodeURIComponent(c.id) + '&lang=' + LANG)}">${t('open_in_nb')}</a></span>`}</p>
    <details><summary>${t('show_code')}</summary><pre>${esc(c.code)}</pre></details></article>`;
}
function recordedOf(c) { return results[c.id] || RECORDED[c.id] || null; }
function renderOne() {
  if (VIEW !== 'check' || !CHECKS.length) return;
  const id = new URLSearchParams(location.search).get('id') || '';
  const c = CHECKS.find(x => x.id === id);
  $('#onecheck').innerHTML = c ? cardHtml(c, recordedOf(c)) : `<p>${t('check_missing', { id: esc(id) })}</p>`;
}
function loadRecorded(d) {
  RECINFO = d; RECCOMMIT = String(d.library || '').split(' ')[0];
  RECORDED = {};
  const said = d.said || {};
  Object.keys(d.states || {}).forEach(id => { RECORDED[id] = { kind: d.states[id], text: said[id] || '', ms: null }; });
  if (EDITION) results = RECORDED;
}
function renderChecks(list) {
  if (!CHECKS.length || VIEW !== 'checks') return;   // a view that is not shown builds nothing
  const show = $('#show').value;
  const rows = list.filter(c => {
    const r = results[c.id];
    if (show === 'bad') return r && r.kind !== 'pass';
    if (show === 'differs') return r && differs(c, r);
    if (show === 'changed') return r && LAST[c.id] && LAST[c.id] !== r.kind;
    return true;
  });
  if (!list.length) { $('#chklist').innerHTML = `<p>${t('filter_empty')}</p>`; return; }
  const byDom = {};
  rows.forEach(c => (byDom[c.domain] = byDom[c.domain] || []).push(c));
  let html = '';
  for (const dom of Object.keys(byDom).sort()) {
    const cs = byDom[dom];
    const n = { pass: 0, fail: 0, err: 0, run: 0 };
    cs.forEach(c => { const r = results[c.id]; if (r) { n[r.kind]++; n.run++; } });
    const tally = n.run ? `${fmtN(n.pass)} ${t('sum_pass')}${n.fail ? ', ' + fmtN(n.fail) + ' ' + t('sum_fail') : ''}${n.err ? ', ' + fmtN(n.err) + ' ' + t('sum_err') : ''}` : fmtN(cs.length);
    const items = cs.map(c => cardHtml(c, results[c.id])).join('');
    html += `<details class="dom" ${n.fail + n.err > 0 || DOMAIN !== '*' || QUERY ? 'open' : ''}><summary><span>${esc(dom)}</span><span class="n">${tally}</span></summary>${items}</details>`;
  }
  $('#chklist').innerHTML = html || `<p>${t('filter_empty')}</p>`;
}
function renderTotals() {
  const n = { pass: 0, fail: 0, err: 0 }, times = [];
  let own = 0, diff = 0, none = 0;
  shown.forEach(c => { const r = results[c.id]; if (!r) return; n[r.kind]++; times.push(r.ms);
    if (r.kind !== 'pass') { const g = ringOf(c); if (!g || g.kind === 'none') none++; else if (differs(c, r)) diff++; else own++; }
    else if (differs(c, r)) diff++; });
  if (!times.length) { $('#totals').innerHTML = ''; return; }
  const tiles = [[fmtN(n.pass), t('sum_pass')], [fmtN(n.fail), t('sum_fail')], [fmtN(n.err), t('sum_err')]];
  if (VERD && VERD.verdicts) tiles.push([fmtN(own), t('sum_own')], [fmtN(diff), t('sum_diff')], [fmtN(none), t('sum_none')]);
  $('#totals').innerHTML = tiles.map(([v, l]) => `<div><div class="v">${v}</div><div class="k">${l}</div></div>`).join('');
}
let running = false;
async function runChecks(list) {
  if (running || !list.length) return;
  if (!stzReady) { $('#runinfo').textContent = t('play_waiting'); return; }
  running = true; $('#runall').disabled = $('#rundomain').disabled = $('#runfailed').disabled = true;
  const t0 = performance.now(), ms = [];
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const r = await run(c.code);
    results[c.id] = { kind: kindOf(r), text: r.text, ms: r.ms }; ms.push(r.ms);
    $('#prog').style.width = (100 * (i + 1) / list.length) + '%';
    if (i % 25 === 24 || i === list.length - 1) { $('#runinfo').textContent = t('running', { i: fmtN(i + 1), n: fmtN(list.length) }); renderTotals(); renderChecks(shown); }
  }
  ms.sort((a, b) => a - b);
  $('#runinfo').textContent = t('run_done', { n: fmtN(list.length), s: fmt1((performance.now() - t0) / 1000), ms: fmt1(ms[Math.floor(ms.length / 2)]) });
  renderChecks(shown); renderTotals(); renderDomains();
  const now = {}; CHECKS.forEach(c => { if (results[c.id]) now[c.id] = results[c.id].kind; });
  try { localStorage.setItem('atelier.last', JSON.stringify(Object.assign({}, LAST, now))); } catch (e) {}
  running = false; $('#runall').disabled = $('#rundomain').disabled = false;
  $('#runfailed').disabled = !shown.some(c => results[c.id] && results[c.id].kind !== 'pass');
}
$('#runall').onclick = () => { DOMAIN = '*'; QUERY = ''; $('#search').value = ''; shown = selection(); renderDomains(); runChecks(shown); };
$('#rundomain').onclick = () => { shown = selection(); runChecks(shown); };
$('#runfailed').onclick = () => runChecks(shown.filter(c => results[c.id] && results[c.id].kind !== 'pass'));
$('#show').onchange = () => renderChecks(shown);
$('#search').oninput = () => { QUERY = $('#search').value; shown = selection(); renderChecks(shown); renderTotals(); };
document.addEventListener('keydown', e => { if (e.ctrlKey && e.key.toLowerCase() === 'k' && VIEW === 'checks') { e.preventDefault(); $('#search').focus(); } });

// ---- coverage: the five states apart, per domain and per file ----
let TOURS = null;
const pct = (a, b) => b ? fmt1(100 * a / b) : '';
function renderCoverage() {
  if (!TOURS || !TOURS.totals || VIEW !== 'coverage') return;
  const T = TOURS, x = T.totals;
  $('#coverhead').textContent = t('coverage_head', { judged: fmtN(x.judged), claims: fmtN(x.claims), pct: pct(x.judged, x.claims), files: fmtN(x.files), kept: fmtN(x.kept), diverged: fmtN(x.diverged), unreached: fmtN(x.unreached), unjudged: fmtN(x.unjudged) });
  $('#coverfiles').textContent = t('coverage_files', { finished: fmtN(x.finished), broke: fmtN(x.broke), notstarted: fmtN(x.not_started), hung: fmtN(x.hung), keptcode: fmtN(x.kept_code), taken: T.taken, library: T.library, rnxc: T.rnxc, engine: T.engine, s: fmtN(Math.round(x.ms / 1000)) });
  const row = (name, d, cls) => `<tr class="${cls}"><td class="name">${esc(name)}</td><td class="ctx">${fmtN(d.files)}</td><td>${fmtN(d.claims)}</td><td>${fmtN(d.judged)}</td><td>${pct(d.judged, d.claims)}</td><td class="ctx">${fmtN(d.kept)}</td><td class="ctx">${fmtN(d.diverged)}</td><td class="ctx">${fmtN(d.unreached)}</td><td class="ctx">${fmtN(d.unjudged)}</td></tr>`;
  const head = `<thead><tr><th scope="col">${t('col_domain')}</th><th scope="col" class="ctx">${t('col_files')}</th><th scope="col">${t('col_then')}</th><th scope="col">${t('col_judged')}</th><th scope="col">${t('col_pct')}</th><th scope="col" class="ctx">${t('col_kept')}</th><th scope="col" class="ctx">${t('col_diverged')}</th><th scope="col" class="ctx">${t('col_unreached')}</th><th scope="col" class="ctx">${t('col_unjudged')}</th></tr></thead>`;
  let h = `<table>${head}<tbody>` + Object.keys(T.domains).sort().map(k => row(k, T.domains[k], '')).join('') + row(t('every_domain'), x, 'total') + '</tbody></table>';
  const byDom = {};

    if (l === '') { flush(); continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { flush(); const n = Math.min(4, m[1].length + 1); h += `<h${n}>${mdInline(m[2])}</h${n}>`; continue; }
    if ((m = /^>\s?(.*)$/.exec(l))) { flush(); h += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    if ((m = /^[-*]\s+(.*)$/.exec(l))) { if (para.length) flush(); if (!list || list.tag !== 'ul') { flush(); list = { tag: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = /^\d+[.)]\s+(.*)$/.exec(l))) { if (para.length) flush(); if (!list || list.tag !== 'ol') { flush(); list = { tag: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if (list) { list.items[list.items.length - 1] += ' ' + l; continue; }
    para.push(l);
  }
  flush();
  return h;
}
async function lsCourses() {
  if (EDITION || VIEW !== 'lessons' || LS.courses) return;
  try { LS.courses = await (await fetch('/atelier/courses')).json(); } catch (e) { $('#lsinfo').textContent = t('lib_gone'); return; }
  const q = new URLSearchParams(location.search);
  let last = {}; try { last = JSON.parse(localStorage.getItem('atelier.lesson') || '{}'); } catch (e) {}
  const c = LS.courses.courses.find(x => x.slug === (q.get('course') || last.course)) || LS.courses.courses[0];
  const ch = (c && c.chapters.find(x => x.id === (q.get('chapter') || last.chapter))) || (c && c.chapters[0]);
  LS.sel = { course: c && c.slug, chapter: ch && ch.id, lang: q.get('clang') || last.lang || LANG };
  $('#lslearner').value = lsLearner();
  renderLessons();
  lsOpen();
}
function lsCourse() { return LS.courses && LS.courses.courses.find(x => x.slug === LS.sel.course); }
function lsChapter() { const c = lsCourse(); return c && c.chapters.find(x => x.id === LS.sel.chapter); }
function renderLessons() {
  if (EDITION || VIEW !== 'lessons' || !LS.courses) return;
  const opt = (v, label, on) => `<option value="${esc(v)}" ${on ? 'selected' : ''}>${esc(label)}</option>`;
  $('#lscourse').innerHTML = LS.courses.courses.map(c => opt(c.slug, t('course_' + c.slug), c.slug === LS.sel.course)).join('');
  const c = lsCourse();
  $('#lschapter').innerHTML = (c ? c.chapters : []).map(ch => opt(ch.id, ch.n + ' \u00B7 ' + (ch.titles[LS.sel.lang] || ch.titles.en || ch.id), ch.id === LS.sel.chapter)).join('');
  const ch = lsChapter();
  const langs = LS.courses.languages.filter(l => ch && ch.titles[l]);
  if (ch && !ch.titles[LS.sel.lang]) LS.sel.lang = ch.titles.en ? 'en' : langs[0];
  $('#lslang').innerHTML = langs.map(l => opt(l, t('clang_' + l), l === LS.sel.lang)).join('');
  renderLesson();
}
async function lsOpen() {
  if (!LS.sel.course || !LS.sel.chapter) return;
  try { localStorage.setItem('atelier.lesson', JSON.stringify(LS.sel)); } catch (e) {}
  const qs = new URLSearchParams(location.search);
  qs.set('course', LS.sel.course); qs.set('chapter', LS.sel.chapter); qs.set('clang', LS.sel.lang);
  history.replaceState(null, '', location.pathname + '?' + qs.toString());
  $('#lsinfo').textContent = t('ls_opening');
  try {
    const r = await fetch('/atelier/lesson', { method: 'POST', body: JSON.stringify({ course: LS.sel.course, chapter: LS.sel.chapter, lang: LS.sel.lang, learner: lsLearner() }) });
    if (r.status !== 200) { $('#lsinfo').textContent = r.status === 503 ? t('play_waiting') : await r.text(); return; }
    LS.lesson = await r.json();
  } catch (e) { $('#lsinfo').textContent = t('lib_gone'); return; }
  LS.cells = LS.lesson.blocks.filter(b => b.kind === 'cell').map(b => b.code);
  LS.run = null;
  $('#lsinfo').textContent = '';
  renderLesson();
}
function lsProgress() {
  const ex = LS.lesson.blocks.filter(b => b.kind === 'exercise' && !b.missing);
  return ex.length ? t('ls_progress', { n: fmtN(ex.filter(b => b.passed).length), m: fmtN(ex.length), who: esc(LS.lesson.learner) }) : t('ls_progress_none');
}
function exResultHtml(b) {
  if (!b.verdict) return '';
  const word = b.verdict === 'passed' ? `<span class="st st-kept">${t('ls_v_passed')}</span>` : b.verdict === 'error' ? `<span class="st st-err">${t('ls_v_error')}</span>` : `<span class="st st-diverged">${t('ls_v_diverged')}</span>`;
  let h = `<div class="verdictrow">${word}<span>${b.passed ? t('ls_counts') : (b.verdict === 'passed' ? t('ls_counts_not') : '')}</span>${b.seconds != null ? `<span>${t('ls_seconds', { s: fmt1(b.seconds) })}</span>` : ''}</div>`;
  if (b.why) h += `<p>${esc(b.why)}</p>`;
  if (b.output) h += `<p class="facelabel">${t('ls_printed')}</p><pre>${esc(b.output)}</pre>`;
  return h;
}
function renderLesson() {
  if (!LS.lesson || !$('#lesson')) return;
  const L = LS.lesson, rtl = L.lang === 'ar';
  let h = `<div class="card"><p class="eyebrow">${esc(t('course_' + L.course))} \u00B7 ${t('ls_chapter_n', { n: esc(L.n) })}</p><h3 lang="${esc(L.lang)}" dir="${rtl ? 'rtl' : 'ltr'}" style="font-family:Fraunces,Georgia,serif;font-size:var(--title);font-weight:600;margin:8px 0 0">${esc(L.title)}</h3>
    ${L.world ? `<p class="hint">${t('ls_world', { world: esc(L.world) })}</p>` : ''}<p class="lsprogress">${lsProgress()}</p></div>`;
  if (L.draft) h += `<div class="notice"><p style="margin:0">${t('ls_draft', { lang: t('clang_' + L.lang) })}</p></div>`;
  let n = 0;
  L.blocks.forEach((b, i) => {
    if (b.kind === 'prose') h += `<div class="prose" lang="${esc(L.lang)}" dir="${rtl ? 'rtl' : 'ltr'}">${md(b.text, i === 0)}</div>`;
    else if (b.kind === 'fence') h += `<pre>${esc(b.text)}</pre>`;
    else if (b.kind === 'cell') {
      n = b.n;
      const code = LS.cells[n - 1] != null ? LS.cells[n - 1] : b.code;
      const rows = Math.max(3, Math.min(24, code.split('\n').length + 1));
      h += `<article class="card nbcell lscell" id="lcell-${n}"><div class="cellhead"><span class="cellno">${t('nb_cell', { n })}</span>
        <button type="button" class="act primary" data-lrun="${n}">${t('nb_run_to')}</button></div>
        <textarea id="lcode-${n}" spellcheck="false" rows="${rows}" dir="ltr" aria-label="${esc(t('nb_code_label', { n }))}">${esc(code)}</textarea>
        <div class="cellout" id="lout-${n}" aria-live="polite"></div></article>`;
    } else if (b.kind === 'exercise') {
      if (b.missing) { h += `<div class="card"><p>${esc(b.missing)}</p></div>`; return; }
      const rows = Math.max(5, Math.min(20, (b.work || '').split('\n').length + 2));
      h += `<article class="card exercise" id="ex-${esc(b.id)}"><p class="eyebrow">${t('ls_exercise', { id: esc(b.id) })}</p>
        <div class="task" lang="${esc(b.tasklang)}" dir="${b.tasklang === 'ar' ? 'rtl' : 'ltr'}">${md(b.task, false)}</div>
        <label for="lwork-${esc(b.id)}">${t('ls_your_answer')}</label>
        <textarea id="lwork-${esc(b.id)}" spellcheck="false" rows="${rows}" dir="ltr">${esc(b.work || '')}</textarea>
        <div class="row" style="margin-top:12px"><button type="button" class="act primary" data-ex="${esc(b.id)}">${t('ls_check')}</button></div>
        <p class="hint">${t('ls_check_note')}</p>
        <div id="lres-${esc(b.id)}" aria-live="polite">${exResultHtml(b)}</div></article>`;
    }
  });
  $('#lesson').innerHTML = h;
  LS.cells.forEach((c, i) => {
    const ta = $('#lcode-' + (i + 1)); if (!ta) return;
    ta.oninput = e => { LS.cells[i] = e.target.value; };
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); lsRun(i + 1); } });
  });
  document.querySelectorAll('#lesson button[data-lrun]').forEach(b => b.onclick = () => lsRun(Number(b.dataset.lrun)));
  document.querySelectorAll('#lesson button[data-ex]').forEach(b => b.onclick = () => lsCheck(b.dataset.ex));
  renderLessonOutputs();
}
function courtHtml(v) {
  if (!v) return '';
  if (v.kept === -1) return `<div class="court"><p class="hint" style="margin:0">${v.error ? t('ls_court_error', { why: esc(v.error) }) : t('ls_court_none')}</p></div>`;
  const rows = v.report.map(([p, hit]) => `<li><code>#--&gt; ${esc(p)}</code>${st(hit === 1 ? 'kept' : hit === 2 ? 'unperceived' : 'diverged')}</li>`).join('');
  const unseen = v.report.some(r => r[1] === 2) ? `<p class="hint">${t('ls_unperceived')}</p>` : '';
  return `<div class="court"><p class="facelabel"><b>${t('ls_court')}</b></p><ul>${rows}</ul>${unseen}${v.error ? `<p>${t('ls_court_error', { why: esc(v.error) })}</p>` : ''}</div>`;
}
const LSCUR = () => LS.run && Object.assign(LS.run, { box: n => $('#lcode-' + n), info: m => { $('#lsinfo').textContent = m; }, keep: (n, code) => { LS.cells[n - 1] = code; } });
function renderLessonOutputs() {
  LS.cells.forEach((c, i) => {
    const out = $('#lout-' + (i + 1)); if (!out) return;
    if (!LS.run || i + 1 > LS.run.ran) { out.innerHTML = ''; return; }
    CUR = LSCUR();
    let h = '';
    if (i + 1 === LS.run.ran) h += summaryHtml(LS.run);
    (LS.run.scenes || []).forEach(sc => { if (sc.states && sc.states.length && where(sc.line)[0] === i + 1) h += sceneHtml(sc); });
    (LS.run.sees || []).forEach(s => { if (where(s.line)[0] === i + 1) h += seeHtml(s, true); });
    h += courtHtml((LS.run.verdicts || [])[i]);
    out.innerHTML = h;
  });
  document.querySelectorAll('#lesson .cellout button[data-form]').forEach(b => b.onclick = () => { CUR = LSCUR(); putForm(Number(b.dataset.see), Number(b.dataset.form)); });
}
async function lsRun(k) {
  if (EDITION || LS.busy || !LS.lesson) return;
  if (!stzReady) { $('#lsinfo').textContent = t('play_waiting'); return; }
  LS.busy = true;
  document.querySelectorAll('#lesson button[data-lrun], #lsrunall').forEach(b => b.disabled = true);
  $('#lsinfo').textContent = t('nb_running', { k });
  const cells = LS.cells.slice();
  try {
    const r = await fetch('/atelier/lesson/run', { method: 'POST', body: JSON.stringify({ course: LS.lesson.course, chapter: LS.lesson.chapter, lang: LS.lesson.lang, run: k, cells }) });
    if (r.status !== 200) throw new Error(await r.text());
    LS.run = await r.json(); LS.run.cells = cells;
    $('#lsinfo').textContent = '';
  } catch (e) { LS.run = null; $('#lsinfo').textContent = t('lib_gone'); }
  LS.busy = false;
  document.querySelectorAll('#lesson button[data-lrun], #lsrunall').forEach(b => b.disabled = false);
  renderLessonOutputs();
  const out = $('#lout-' + k); if (out && out.firstElementChild) out.firstElementChild.scrollIntoView({ block: 'nearest' });
}
async function lsCheck(id) {
  if (EDITION || LS.busy) return;
  const b = LS.lesson.blocks.find(x => x.kind === 'exercise' && x.id === id);
  const ta = $('#lwork-' + id), res = $('#lres-' + id), btn = document.querySelector(`#lesson button[data-ex="${id}"]`);
  if (!b || !ta) return;
  LS.busy = true; btn.disabled = true;
  res.innerHTML = `<p>${t('ls_checking')}</p>`;
  try {
    const r = await fetch('/atelier/exercise', { method: 'POST', body: JSON.stringify({ course: LS.lesson.course, exercise: id, code: ta.value, learner: lsLearner(), lang: LS.lesson.lang }) });
    if (r.status !== 200) throw new Error(await r.text());
    const d = await r.json();
    Object.assign(b, { verdict: d.verdict, passed: d.counts, why: d.why, output: d.output, seconds: d.seconds, work: ta.value });
    res.innerHTML = exResultHtml(b);
    const p = document.querySelector('#lesson .lsprogress'); if (p) p.innerHTML = lsProgress();
  } catch (e) { res.innerHTML = `<p>${esc(String(e.message || e).slice(0, 300))}</p>`; }
  LS.busy = false; btn.disabled = false;
}
if ($('#lscourse') && !EDITION) {
  $('#lscourse').onchange = () => { LS.sel.course = $('#lscourse').value; const c = lsCourse(); LS.sel.chapter = c && c.chapters[0] && c.chapters[0].id; renderLessons(); lsOpen(); };
  $('#lschapter').onchange = () => { LS.sel.chapter = $('#lschapter').value; renderLessons(); lsOpen(); };
  $('#lslang').onchange = () => { LS.sel.lang = $('#lslang').value; renderLessons(); lsOpen(); };
  $('#lslearner').onchange = () => { try { localStorage.setItem('atelier.learner', $('#lslearner').value.trim()); } catch (e) {} lsOpen(); };
  $('#lsrunall').onclick = () => lsRun(LS.cells.length);
}

// ---- load: the dictionary first, then the data ----
pickLang();
if (NBED) { I18N = EDITION.i18n; applyLang(); }
else fetch(URLS.i18n).then(r => r.json()).then(d => { I18N = d; applyLang(); lsCourses(); }).catch(() => { applyLang(); lsCourses(); });
if (!NBED) fetch(URLS.checks).then(r => r.json()).then(d => { META = d; CHECKS = d.checks; shown = selection(); renderDomains(); renderChecks(shown); renderTotals(); renderStatus(); renderOne();
  const fork = new URLSearchParams(location.search).get('fork');
  if (fork && VIEW === 'notebook' && NB) { forkCheck(fork); const qs = new URLSearchParams(location.search); qs.delete('fork'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
});
if (!NBED) fetch(URLS.results).then(r => r.json()).then(d => { if (d && d.states) { loadRecorded(d); shown = selection(); renderChecks(shown); renderTotals(); renderOne(); } }).catch(() => {});
if (URLS.verdicts) fetch(URLS.verdicts).then(r => r.json()).then(d => { VERD = d; renderChecks(shown); renderTotals(); }).catch(() => {});
if (!NBED) fetch(URLS.tours).then(r => r.json()).then(d => { TOURS = d; renderCoverage(); }).catch(() => {});
</script>
