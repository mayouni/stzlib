<script type="module">
// THE BROWSER RUNNER (KP1 of SOFTANZA_GPU_PLAN.md). One description, two
// runners, one verdict: this page grades the same text the desktop face
// grades, in the same words, from the same facts -- the reference is the
// puzzle's description interpreted by stz.wasm (the native checker's own
// interpreter, compiled to wasm), the learner's kernel is the WGSL the same
// wasm transpiles from the learner's text, run by the browser's WebGPU with a
// NaN margin after the output, at the visible shape and a hidden one. No
// server grades anything; nothing is stored; a laptop's integrated GPU is
// enough, and no vendor driver is in the picture.
const q = new URLSearchParams(location.search);
const id = (q.get("p") || "kp-01").toLowerCase();
const lang = (q.get("lang") || "en").toLowerCase();
const MARGIN = 256;
const el = (s) => document.getElementById(s);
const exDir = `../exercises/${id}/`;

async function text(path) {
  const r = await fetch(path, { cache: "no-store" }); // the course files are small and may change under the page
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return await r.text();
}
function facts(zknw) {
  // subject | relation | object, the manifest's own shape
  return zknw.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith("knowledge") && l !== "facts")
    .map(l => l.split("|").map(p => p.trim())).filter(p => p.length === 3);
}
function fact(fs, rel) { const f = fs.find(p => p[1].toLowerCase() === rel); return f ? f[2] : ""; }
// the five data recipes the desktop face knows, the same here
function recipe(name, len) {
  const a = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    switch (name.toLowerCase()) {
      case "ramp": a[i] = i; break;
      case "half": a[i] = i * 0.5; break;
      case "mod13": a[i] = (i * 7) % 13; break;
      case "ones": a[i] = 1; break;
      case "tenths": a[i] = (i % 10) / 10; break;
      case "mod7": a[i] = (i * 3) % 7; break;

}
// the declared NAMES: 'in a int' declares a, an int (GL0) -- the type word is the engine's to read
function specLines(spec, head) {
  return spec.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith(head + " ")).map(l => l.slice(head.length + 1).trim().toLowerCase().split(/\s+/)[0]);
}
// a list as Ring's @@ writes it: [ "a", "b" ], and [ ] when empty -- the face's words
function ringList(xs) { return xs.length ? `[ ${xs.map(x => `"${x}"`).join(", ")} ]` : "[ ]"; }

const memory = new WebAssembly.Memory({ initial: 64 });
const { instance } = await WebAssembly.instantiateStreaming(fetch("./stz.wasm", { cache: "no-store" }), { env: { memory } });

}
// GL0 (typed buffers): the floats per element of each input and of the output, as the

  E.stz_reset();

  if (E.stz_gpu_spec_compile(sp, enc.encode(spec).length) !== 0) return null;
  return { ins: specLines(spec, "in").map((_, k) => E.stz_gpu_spec_in_width(k)), out: E.stz_gpu_spec_out_width() };
}
// the reference, interpreted on this machine by the checker's own interpreter
function interpret(spec, inputs, scalars, n) {
  E.stz_reset();
  const sp = putBytes(enc.encode(spec));
  if (E.stz_gpu_spec_compile(sp, enc.encode(spec).length) !== 0) throw new Error("the reference description is refused: " + wasmError());
  const ptrs = inputs.map(v => putF32(v));
  const insP = putU32(new Uint32Array(ptrs));
  const lensP = putF64(new Float64Array(inputs.map(v => v.length)));
  const scP = putF32(new Float32Array(scalars.length ? scalars : [0]));
  const w = E.stz_gpu_spec_out_width();

  if (E.stz_gpu_spec_eval_masked(insP, inputs.length, lensP, scP, scalars.length, n, outP, maskP) !== 0) throw new Error("the interpreter could not evaluate the reference");
  return { ref: new Float32Array(memory.buffer, outP, n * w).slice(), mask: new Uint8Array(memory.buffer, maskP, n).slice(), flops: E.stz_gpu_spec_eval_flops(), w };
}

// GZ0: the learner's kernel, run by the interpreter with the sanitizer watching -- what the
// device runs without a word: two threads of one stage writing one slot (a race), a write or
// a read past a shared array, a read of a slot no stage wrote. Null when it cannot be run.
function sanitize(spec, inputs, scalars, n) {
  E.stz_reset();
  const sp = putBytes(enc.encode(spec));
  if (E.stz_gpu_spec_compile(sp, enc.encode(spec).length) !== 0) return null;
  const ptrs = inputs.map(v => putF32(v));
  const insP = putU32(new Uint32Array(ptrs));
  const lensP = putF64(new Float64Array(inputs.map(v => v.length)));
  const scP = putF32(new Float32Array(scalars.length ? scalars : [0]));
  const outP = alloc(n * E.stz_gpu_spec_out_width() * 4); const maskP = alloc(n);

  const lines = new TextDecoder().decode(new Uint8Array(memory.buffer, rp, rn)).split("\n").filter(x => x);

}
const SAN = { en: "The sanitizer watched the interpreter run your kernel. What the device does not say:",
              fr: "Le sanitizer a observe l'interpreteur executer votre noyau. Ce que le GPU ne dit pas :",
              ar: "\u0631\u0627\u0642\u0628 \u0627\u0644\u0645\u0639\u0642\u0645 \u0627\u0644\u0645\u0641\u0633\u0631 \u0648\u0647\u0648 \u064a\u0634\u063a\u0644 \u0646\u0648\u0627\u062a\u0643. \u0645\u0627 \u0644\u0627 \u064a\u0642\u0648\u0644\u0647 \u0627\u0644\u062c\u0647\u0627\u0632:" };

let device = null;
if (navigator.gpu) {
  const adapter = await navigator.gpu.requestAdapter();
  if (adapter) { device = await adapter.requestDevice(); const i = adapter.info || {}; el("where").textContent = `WebGPU: ${i.vendor || "?"} ${i.architecture || ""} ${i.device || ""}`.trim(); }
}
if (!device) el("where").textContent = "no WebGPU in this browser: the kernel cannot run here";

async function runKernel(wgsl, inputs, scalars, n, w = 1) {
  const mk = (usage, size) => device.createBuffer({ size, usage });
  const module = device.createShaderModule({ code: wgsl });
  const pipeline = device.createComputePipeline({ layout: "auto", compute: { module, entryPoint: "main" } });
  const tile = mk(GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 16);
  const params = mk(GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 64);
  device.queue.writeBuffer(tile, 0, new Uint32Array([0, 0, 0, 0]));
  const pbuf = new ArrayBuffer(64);
  new Uint32Array(pbuf, 0, 2).set([n, 0]);
  if (scalars.length) new Float32Array(pbuf, 8, scalars.length).set(scalars);
  device.queue.writeBuffer(params, 0, pbuf);
  const entries = [{ binding: 0, resource: { buffer: tile } }, { binding: 1, resource: { buffer: params } }];
  let b = 2;
  for (const v of inputs) { const buf = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, v.length * 4); device.queue.writeBuffer(buf, 0, v); entries.push({ binding: b++, resource: { buffer: buf } }); }
  const total = n * w + MARGIN;
  const out = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC, total * 4);
  device.queue.writeBuffer(out, 0, new Float32Array(total).fill(NaN)); // the region AND the margin, NaN before the kernel runs
  entries.push({ binding: b, resource: { buffer: out } });
  const stage = mk(GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST, total * 4);
  let bind;
  device.pushErrorScope("validation");
  bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries });
  const err = await device.popErrorScope();
  if (err) throw new Error("the kernel cannot be bound: " + err.message);
  const encdr = device.createCommandEncoder();
  const pass = encdr.beginComputePass();
  pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(Math.ceil(n / 256)); pass.end();
  encdr.copyBufferToBuffer(out, 0, stage, 0, total * 4);
  const t0 = performance.now();
  device.queue.submit([encdr.finish()]);
  await device.queue.onSubmittedWorkDone();
  const ms = performance.now() - t0;
  await stage.mapAsync(GPUMapMode.READ);
  const got = new Float32Array(stage.getMappedRange()).slice();
  stage.unmap();
  return { got, ms };
}

// ---- KP3: the roofline. The roofs are measured here, on this adapter, with the engine's own
// copy and peak kernels (stz.wasm carries their texts), on the instrument the native floor uses:
// the best of several dispatch-and-wait times on the wall clock. Measured once per page load.
function roofText(which) {
  E.stz_reset();
  const out = alloc(65536);
  const n = E.stz_gpu_roof_wgsl(which, out, 65536);
  if (n < 0) throw new Error("the engine gave no roof kernel");
  return new TextDecoder().decode(new Uint8Array(memory.buffer, out, n));
}
// A browser's wait for the device resolves late by a millisecond or more, which swamps a kernel of
// two: one dispatch timed with its wait read SAXPY at 174% of the copy roof on 2026-10-27. So each
// sample is a BATCH of dispatches in one submission, its time divided by the batch -- for the roofs
// and the learner's kernel alike, so the fraction compares like with like.
const BATCH = 10;
async function bestOf(pipeline, bind, groups, reps) {
  let best = Infinity;
  for (let r = 0; r < reps; r++) {
    const enc2 = device.createCommandEncoder();
    for (let b = 0; b < BATCH; b++) {
      const pass = enc2.beginComputePass();
      pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(groups); pass.end();
    }
    const t0 = performance.now();
    device.queue.submit([enc2.finish()]);
    await device.queue.onSubmittedWorkDone();
    best = Math.min(best, (performance.now() - t0) / BATCH);
  }
  return best;
}
function storage(bytes, fill) {
  const b = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  if (fill) { const f = new Float32Array(bytes / 4); for (let i = 0; i < f.length; i++) f[i] = (i % 97) * 0.01; device.queue.writeBuffer(b, 0, f); }
  return b;
}
function uniform(data) {
  const b = device.createBuffer({ size: Math.max(16, data.byteLength), usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(b, 0, data);

let roofs = null;
async function measureRoofs() {

  // the compute roof: GK3's register-only fma kernel, warmed for a second first (GK3: a cold
  // device reads half its peak)

  const prm = new ArrayBuffer(16);

    { binding: 0, resource: { buffer: tile } }, { binding: 1, resource: { buffer: uniform(prm) } },
    { binding: 2, resource: { buffer: storage(peakN * 4, true) } }, { binding: 3, resource: { buffer: storage(peakN * 4, false) } }] });
  const t0 = performance.now();
  while (performance.now() - t0 < 1000) await bestOf(pp, pbind, peakN / 256, 1);
  const peakMs = await bestOf(pp, pbind, peakN / 256, 5);
  // the bandwidth roof: GK3's copy kernel, 16 MB in and 16 MB out
  const copyN = E.stz_gpu_roof_number(0);
  const cm = device.createShaderModule({ code: roofText(0) });
  const cp = device.createComputePipeline({ layout: "auto", compute: { module: cm, entryPoint: "main" } });
  const cbind = device.createBindGroup({ layout: cp.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: tile } }, { binding: 1, resource: { buffer: storage(copyN * 4, true) } },
    { binding: 2, resource: { buffer: storage(copyN * 4, false) } }] });

}
async function roofline(wgsl, refSpec, nIns, scalars, opsPerElement) {
  const r = await measureRoofs();

  const module = device.createShaderModule({ code: wgsl });
  const pipeline = device.createComputePipeline({ layout: "auto", compute: { module, entryPoint: "main" } });
  const pbuf = new ArrayBuffer(64);
  new Uint32Array(pbuf, 0, 2).set([N, 0]);
  if (scalars.length) new Float32Array(pbuf, 8, scalars.length).set(scalars);
  const entries = [{ binding: 0, resource: { buffer: uniform(new Uint32Array([0, 0, 0, 0])) } }, { binding: 1, resource: { buffer: uniform(new Uint8Array(pbuf)) } }];
  for (let k = 0; k < nIns; k++) entries.push({ binding: 2 + k, resource: { buffer: storage(N * 4, true) } });
  entries.push({ binding: 2 + nIns, resource: { buffer: storage(N * 4, false) } });

  await bestOf(pipeline, bind, N / 256, 3);

    `It did ${(x.flops / 1e6).toFixed(1)} million operations: ${x.gflops.toFixed(1)} GFLOP/s, ${(100 * x.peak).toFixed(2)}% ` +

// the verdict words are the desktop face's, letter for letter; the band is the puzzle's
function band() { const b = fact(puzzle.facts, "band"); return b ? parseFloat(b) : 1e-6; }

// a sibling program under wrong/ is Ring that builds the same description through the face;

function specFromRing(src) {

function littleMarkdown(md) {
  const esc = md.replace(/\r/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.split("\n").map(line => {
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) return `<b class="h${h[1].length}">${h[2]}</b>`;
    return line
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")

}

    const r = fact(puzzle.facts, "input-" + name);

    if (lenS && !/^\d+$/.test(lenS)) lenS = fact(puzzle.facts, "scalar-" + lenS.toLowerCase()); // a length may name a scalar

    const v = fact(puzzle.facts, "scalar-" + name);
    if (v === "") throw new Error(`the puzzle binds no scalar '${name}'`);
