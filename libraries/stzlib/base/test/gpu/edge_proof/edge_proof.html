<!doctype html>
<meta charset="utf-8">
<title>stz G5 edge convergence proof</title>
<style>
  body { font-family: ui-monospace, monospace; margin: 2rem; background: #101418; color: #d8dee6; }
  .ok { color: #6ec06e; } .fail { color: #e06c75; } h1 { font-size: 1.1rem; } h2 { font-size: 1rem; margin-top: 1.2rem; }
  pre { background: #181e24; padding: .8rem; overflow-x: auto; max-height: 14rem; }
</style>
<h1>G5 edge convergence: same spec &rarr; same WGSL &rarr; same numbers (KP0 and KP3: eight cases)</h1>
<div id="log">running...</div>
<div id="kernels"></div>
<script type="module">
import { cases } from "./fixture.js";

const log = document.getElementById("log");
const kernels = document.getElementById("kernels");
const lines = [];
let passes = 0, fails = 0;
function chk(label, cond) {
  lines.push(`<div class="${cond ? "ok" : "fail"}">[${cond ? "OK" : "FAIL"}] ${label}</div>`);
  cond ? passes++ : fails++;
  log.innerHTML = lines.join("");
}
function done() {
  lines.push(`<div><b>TOTAL: ${passes + fails} checks, ${passes} pass, ${fails} fail</b></div>`);
  log.innerHTML = lines.join("");
  document.title = fails === 0 ? "EDGE PROOF PASS" : "EDGE PROOF FAIL";
}
// an element both sides leave unwritten reads 0 (WebGPU zero-fills a new buffer)
// and a NaN on both sides is the same NaN for this proof
const same = (x, y) => x === y || (Number.isNaN(x) && Number.isNaN(y));

try {
  // ---- 1. the WASM transpiler authors the kernels ON THE EDGE
  const memory = new WebAssembly.Memory({ initial: 32 });
  const { instance } = await WebAssembly.instantiateStreaming(
    fetch("./stz.wasm"), { env: { memory } });
  const E = instance.exports;
  chk("stz.wasm loaded (abi " + E.stz_abi_version() + ")", E.stz_abi_version() === 1);

  let device = null;
  if (!navigator.gpu) {
    chk("navigator.gpu present (WebGPU unavailable in this browser)", false);
  } else {
    const adapter = await navigator.gpu.requestAdapter();
    chk("WebGPU adapter acquired", !!adapter);
    device = await adapter.requestDevice();
    const info = adapter.info || {};
    lines.push(`<div>adapter: ${info.vendor || "?"} ${info.architecture || ""} ${info.device || ""} ${info.description || ""}</div>`);
  }

  const enc = new TextEncoder();
  for (const c of cases) {
    const specBytes = enc.encode(c.spec);
    const specPtr = E.stz_alloc(specBytes.length);
    new Uint8Array(memory.buffer, specPtr, specBytes.length).set(specBytes);
    const outPtr = E.stz_alloc(8192);
    const n = E.stz_gpu_wgsl_elementwise(specPtr, specBytes.length, outPtr, 8192);
    chk(`${c.name}: wasm transpiler produced a kernel (${n} chars)`, n > 0);
    const wasmWgsl = new TextDecoder().decode(new Uint8Array(memory.buffer, outPtr, n));
    chk(`${c.name}: the edge WGSL is BYTE-IDENTICAL to the native engine's`, wasmWgsl === c.nativeWgsl);
    const pre = document.createElement("pre");
    pre.textContent = `// ${c.name}\n` + wasmWgsl;
    kernels.appendChild(pre);
    if (!device) continue;

    // ---- 2. the browser's WebGPU runs that exact kernel text
    const module = device.createShaderModule({ code: wasmWgsl });
    const pipeline = device.createComputePipeline({ layout: "auto",
      compute: { module, entryPoint: "main" } });
    const mk = (usage, size) => device.createBuffer({ size, usage });
    const tile = mk(GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 16);
    const params = mk(GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 64);
    device.queue.writeBuffer(tile, 0, new Uint32Array([0, 0, 0, 0]));
    const pbuf = new ArrayBuffer(64);
    new Uint32Array(pbuf, 0, 2).set([c.n, 0]);
    if (c.scalars.length) new Float32Array(pbuf, 8, c.scalars.length).set(c.scalars);
    device.queue.writeBuffer(params, 0, pbuf);
    const entries = [
      { binding: 0, resource: { buffer: tile } },
      { binding: 1, resource: { buffer: params } },
    ];
    let b = 2;
    for (const inp of c.inputs) {
      const buf = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, inp.length * 4);
      device.queue.writeBuffer(buf, 0, new Float32Array(inp));
      entries.push({ binding: b++, resource: { buffer: buf } });
    }
    const out = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, c.n * 4);
    entries.push({ binding: b, resource: { buffer: out } });
    const stage = mk(GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST, c.n * 4);
    const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries });
    const encdr = device.createCommandEncoder();
    const pass = encdr.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bind);
    pass.dispatchWorkgroups(Math.ceil(c.n / 256));
    pass.end();
    encdr.copyBufferToBuffer(out, 0, stage, 0, c.n * 4);
    device.queue.submit([encdr.finish()]);
    await stage.mapAsync(GPUMapMode.READ);
    const got = Array.from(new Float32Array(stage.getMappedRange()));
    let exact = got.length === c.expected.length;
    let firstBad = -1;
    for (let i = 0; i < c.n && exact; i++) if (!same(got[i], c.expected[i])) { exact = false; firstBad = i; }
    chk(`${c.name}: browser WebGPU results EXACTLY equal the native GPU results (${c.n} values)` +
        (exact ? "" : ` -- first difference at ${firstBad}: ${got[firstBad]} vs ${c.expected[firstBad]}`), exact);
  }
  done();
} catch (e) {
  chk("unexpected failure: " + e.message, false);
  done();
}
</script>
