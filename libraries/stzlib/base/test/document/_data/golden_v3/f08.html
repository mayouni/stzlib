<h1>סיכום פרויקט הגינה הקהילתית</h1>
<p>הפרויקט החל באביב עם קבוצה קטנה של מתנדבים מהשכונה. במהלך הקיץ נשתלו יותר משלושים סוגים של ירקות ועשבי תיבול. התושבים נפגשו מדי שבוע כדי לחלק את העבודה ביניהם.</p>
<p>בשנה הבאה נרחיב את השטח ונוסיף מערכת השקיה חכמה. הוועדה תעקוב אחר ההתקדמות באמצעות מדדי ביצוע מרכזיים (KPI)</p>
